    <path d="M 120 180 Q 120 100 190 90 Q 260 80 270 150 Q 280 200 210 260 L 150 310 L 280 310 L 280 350 L 110 350 L 110 310 L 190 240 Q 230 200 230 160 Q 230 130 190 130 Q 150 130 145 180 Z" />
    
    <!-- ZERO HUNGER Text -->
    <text x="310" y="170" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="95" letter-spacing="2">ZERO</text>
    <text x="310" y="260" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="95" letter-spacing="2">HUNGER</text>
  </g>

  <!-- Steam Waves -->
