    <path d="M 320 410 Q 300 450 320 490 Q 340 530 320 570 L 300 570 Q 320 530 300 490 Q 280 450 300 410 Z" />
    <!-- Steam 2 -->
    <path d="M 400 410 Q 380 450 400 490 Q 420 530 400 570 L 380 570 Q 400 530 380 490 Q 360 450 380 410 Z" />
    <!-- Steam 3 -->
