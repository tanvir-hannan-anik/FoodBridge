<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <rect width="800" height="800" fill="#0A0F0D" rx="40"/>
  <rect x="20" y="20" width="760" height="760" fill="#181D1A" rx="32" stroke="#DDA63A" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Number 2 and ZERO HUNGER Title -->
  <g fill="#DDA63A">
